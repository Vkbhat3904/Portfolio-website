<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Vishal Krishna Bhat K. | Portfolio</title>
<meta name="description" content="Portfolio of Vishal Krishna Bhat K., a Computer Science and Engineering student interested in AI, data science and software development." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0F0E0C;
    --surface: #191814;
    --text: #F2EFE8;
    --muted: #9A978D;
    --line: #2C2B26;
    --accent: #E9B44C;
    --accent-ink: #0F0E0C;
    --radius: 14px;
    --display: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
    --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  [data-theme="light"] {
    --bg: #F7F5F0;
    --surface: #FFFFFF;
    --text: #181714;
    --muted: #67645C;
    --line: #E2DED5;
    --accent: #A55E05;
    --accent-ink: #FFFFFF;
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; scroll-padding-top: 90px; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--body);
    font-size: 1.0625rem;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    transition: background .3s, color .3s;
  }
  h1, h2, h3 { font-family: var(--display); letter-spacing: -.02em; line-height: 1.05; margin: 0; }
  p { margin: 0; max-width: 62ch; }
  a { color: inherit; text-underline-offset: .2em; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }

  .container { max-width: 1100px; margin: 0 auto; padding: 0 1.5rem; }

  /* Header */
  .site-header {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; justify-content: space-between; gap: 1rem;
    padding: .9rem 1.5rem;
    background: color-mix(in srgb, var(--bg) 85%, transparent);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
  }
  .logo { font-family: var(--display); font-weight: 700; font-size: 1.1rem; text-decoration: none; }
  .site-header nav { display: flex; gap: 1.25rem; flex-wrap: wrap; }
  .site-header nav a { text-decoration: none; color: var(--muted); font-size: .95rem; }
  .site-header nav a:hover { color: var(--text); }

  .theme-toggle, .chip, .btn {
    font: inherit; font-size: .92rem; cursor: pointer;
    border: 1px solid var(--line); background: transparent; color: var(--text);
    border-radius: 999px; padding: .5rem 1rem;
    transition: border-color .2s, background .2s, color .2s;
  }
  .theme-toggle:hover, .chip:hover, .btn:hover { border-color: var(--text); }
  .chip[aria-pressed="true"], .btn.primary {
    background: var(--accent); border-color: var(--accent); color: var(--accent-ink);
  }

  /* Hero */
  .hero { padding: clamp(4rem, 14vh, 9rem) 0 clamp(3rem, 8vh, 5rem); }
  .status {
    display: inline-flex; align-items: center; gap: .55rem;
    color: var(--muted); font-size: .95rem; margin-bottom: 1.75rem;
  }
  .dot {
    width: 9px; height: 9px; border-radius: 50%; background: var(--accent);
    box-shadow: 0 0 0 0 var(--accent); animation: pulse 2.2s infinite;
  }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 55%, transparent); }
    70%  { box-shadow: 0 0 0 10px transparent; }
    100% { box-shadow: 0 0 0 0 transparent; }
  }
  .hero h1 {
    /* font-size: clamp(3.4rem, 11.5vw, 8rem); */
    font-weight: 700;
    font-variation-settings: "opsz" 96;
    animation: rise .9s cubic-bezier(.2,.7,.2,1) both;
  }
  .role {
    margin-top: 1.5rem; font-size: clamp(1.15rem, 2.4vw, 1.45rem);
    color: var(--muted); max-width: 34ch;
  }
  .ctas { display: flex; gap: .75rem; flex-wrap: wrap; margin-top: 2.25rem; }
  @keyframes rise {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: none; }
  }

  /* Sections */
  .section { padding: clamp(3.5rem, 9vh, 6rem) 0; border-top: 1px solid var(--line); }
  .section-head {
    display: flex; justify-content: space-between; align-items: end;
    gap: 1.5rem; flex-wrap: wrap; margin-bottom: 2.5rem;
  }
  h2 { font-size: clamp(2rem, 4.5vw, 3rem); font-weight: 600; }
  .section-intro { color: var(--muted); margin-top: .75rem; }

  .about-grid {
    display: grid; grid-template-columns: 1.4fr 1fr; gap: 3rem; align-items: start;
  }
  .about-grid p + p { margin-top: 1rem; }
  .about-body { font-size: 1.15rem; color: var(--text); }
  .stats { display: grid; gap: 1.25rem; }
  .stat { border-left: 2px solid var(--accent); padding-left: 1rem; }
  .stat strong {
    display: block; font-family: var(--display); font-size: 2.6rem; font-weight: 700; line-height: 1;
  }
  .stat span { color: var(--muted); font-size: .95rem; }

  /* Work */
  .filters { display: flex; gap: .5rem; flex-wrap: wrap; }
  .grid {
    display: grid; gap: 1.25rem;
    grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
  }
  .card {
    display: flex; flex-direction: column; gap: .9rem;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 1.6rem;
    transition: border-color .25s;
  }
  .card:hover { border-color: var(--accent); }
  .card-meta { display: flex; gap: .6rem; color: var(--muted); font-size: .9rem; }
  .card h3 { font-size: 1.6rem; font-weight: 600; }
  .card p { color: var(--muted); }
  .tags { list-style: none; display: flex; flex-wrap: wrap; gap: .4rem; padding: 0; margin: 0; }
  .tags li {
    font-size: .8rem; padding: .25rem .6rem; border-radius: 6px;
    background: var(--bg); border: 1px solid var(--line);
  }
  .card a {
    margin-top: auto; font-weight: 600; text-decoration: none;
    border-bottom: 1px solid var(--accent); align-self: flex-start; padding-bottom: 2px;
  }

  /* Skills */
  .skills { display: flex; flex-wrap: wrap; gap: .6rem; }
  .skill {
    font-size: 1.05rem; padding: .6rem 1.1rem; border-radius: 999px;
    border: 1px solid var(--line); background: var(--surface);
  }

  /* Contact */
  .contact-grid { display: grid; grid-template-columns: 1.2fr 1fr; gap: 3rem; align-items: start; }
  .big-email {
    font-family: var(--display); font-weight: 600;
    font-size: clamp(1.5rem, 4vw, 2.5rem); text-decoration: none;
    border-bottom: 2px solid var(--accent); padding-bottom: .15rem; word-break: break-all;
  }
  .social-list { list-style: none; padding: 0; margin: 0; display: grid; gap: .75rem; }
  .social-list a { text-decoration: none; color: var(--muted); font-size: 1.1rem; }
  .social-list a:hover { color: var(--text); }
  .copy-row { display: flex; gap: .75rem; flex-wrap: wrap; margin-top: 1.5rem; }
  .live { color: var(--muted); font-size: .92rem; min-height: 1.4em; }

  footer {
    border-top: 1px solid var(--line); padding: 2rem 0;
    color: var(--muted); font-size: .9rem;
  }
  footer .container { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 1rem; }

  /* Responsive */
  @media (max-width: 760px) {
    .about-grid, .contact-grid { grid-template-columns: 1fr; gap: 2rem; }
    .site-header nav { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>

<script type="text/babel">
  const { useState, useEffect } = React;

  const PROFILE = {
    name: "Vishal Krishna Bhat K",
    role: "Computer Science Student | Exploring AI, Data Science & Software Development",
    intro:
      "I'm a Computer Science and Engineering (Data Science) student at Dayananda Sagar College of Engineering, Bengaluru. I enjoy solving problems, exploring machine learning, and building software that turns ideas into practical solutions. I'm always looking for opportunities to learn, experiment, and grow as an engineer.",
    location: "Bengaluru, Karnataka, India",
    email: "vkb39004@gmail.com",
    status: "Learning, Building & Growing",
  };

  const STATS = [
    { value: "9.73", label: "B.E. CGPA" },
    { value: "2027", label: "Graduation year" },
    { value: "ML+AI+DS", label: "Areas of interest" },
  ];

  const PROJECTS = [
  {
    title: "Synthesia — MERN Music Player",
    type: "Full-Stack Development",
    year: "2026",
    summary:
      "A full-stack music player application built using the MERN stack, combining a React frontend with a Node.js and Express backend and MongoDB.",
    tags: ["MongoDB", "Express.js", "React", "Node.js"],
  },
  {
    title: "Diabetic Retinopathy Prediction",
    type: "Machine Learning",
    year: "2026",
    summary:
      "A Python-based machine learning project focused on diabetic retinopathy prediction, exploring the application of machine learning to healthcare problems.",
    tags: ["Python", "Machine Learning", "Healthcare AI"],
  },
  {
    title: "Credit Risk Prediction",
    type: "Data Science",
    year: "2026",
    summary:
      "A data science project focused on analyzing credit-related data to estimate credit risk and support financial risk assessment.",
    tags: ["Python", "Data Analysis", "Machine Learning", "Credit Risk"],
  },
];

  const SKILLS = [
    "Python",
    "C++",
    "SQL",
    "Pandas",
    "NumPy",
    "scikit-learn",
    "Machine Learning",
    "Git & GitHub",
    "JavaScript",
    "Express.js",
    "MongoDB",
  ];

  const SOCIALS = [
    { label: "GitHub", href: "https://github.com/Vishal3904" },
    { label: "LinkedIn", href: "https://www.linkedin.com/in/vishal-krishna-bhat-k-0ba93a32a/" },
  ];

  function useTheme() {
    const [theme, setTheme] = useState(() => {
      try {
        const saved = localStorage.getItem("theme");
        if (saved) return saved;
        return window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      } catch (e) {
        return "dark";
      }
    });

    useEffect(() => {
      document.documentElement.dataset.theme = theme;
      try { localStorage.setItem("theme", theme); } catch (e) { /* storage blocked: still works */ }
    }, [theme]);

    return [theme, setTheme];
  }

  function Header({ theme, onToggle }) {
    return (
      <header className="site-header">
        <a href="#top" className="logo">{PROFILE.name}</a>
        <nav aria-label="Main">
          <a href="#about">About</a>
          <a href="#work">Work</a>
          <a href="#skills">Skills</a>
          <a href="#contact">Contact</a>
        </nav>
        <button className="theme-toggle" onClick={onToggle}
          aria-label={"Switch to " + (theme === "dark" ? "light" : "dark") + " mode"}>
          {theme === "dark" ? "Light" : "Dark"}
        </button>
      </header>
    );
  }

  function Hero() {
    return (
      <section className="hero" id="top">
        <div className="container">
          <p className="status"><span className="dot" aria-hidden="true"></span>{PROFILE.status}</p>
          <h1>{PROFILE.name}</h1>
          <p className="role">{PROFILE.role}</p>
          <p className="section-intro">📍 {PROFILE.location}</p>
          <div className="ctas">
            <a className="btn primary" href="#work">See my work</a>
            <a className="btn" href="#contact">Say hello</a>
          </div>
        </div>
      </section>
    );
  }

  function About() {
    return (
      <section className="section" id="about">
        <div className="container about-grid">
          <div>
            <h2>A little about me</h2>
            <p className="about-body" style={{ marginTop: "1.5rem" }}>{PROFILE.intro}</p>
          </div>
          <div className="stats">
            {STATS.map((s) => (
              <div className="stat" key={s.label}>
                <strong>{s.value}</strong>
                <span>{s.label}</span>
              </div>
            ))}
          </div>
        </div>
      </section>
    );
  }

  function Work() {
    const types = ["All", ...new Set(PROJECTS.map((p) => p.type))];
    const [active, setActive] = useState("All");
    const shown = active === "All" ? PROJECTS : PROJECTS.filter((p) => p.type === active);

    return (
      <section className="section" id="work">
        <div className="container">
          <div className="section-head">
            <div>
              <h2>Selected work</h2>
              <p className="section-intro">Projects and learning experiences that reflect my curiosity about technology.</p>
            </div>
            <div className="filters" role="group" aria-label="Filter projects">
              {types.map((t) => (
                <button key={t} className="chip" aria-pressed={active === t} onClick={() => setActive(t)}>
                  {t}
                </button>
              ))}
            </div>
          </div>

          <div className="grid">
            {shown.map((p) => (
              <article className="card" key={p.title}>
                <div className="card-meta">
                  <span>{p.type}</span>
                  <span>{p.year}</span>
                </div>
                <h3>{p.title}</h3>
                <p>{p.summary}</p>
                <ul className="tags">
                  {p.tags.map((t) => <li key={t}>{t}</li>)}
                </ul>
              </article>
            ))}
          </div>
        </div>
      </section>
    );
  }

  function Skills() {
    return (
      <section className="section" id="skills">
        <div className="container">
          <h2>Skills</h2>
          <p className="section-intro" style={{ marginBottom: "2rem" }}>Technologies I use and continue to develop my skills in.</p>
          <div className="skills">
            {SKILLS.map((s) => <span className="skill" key={s}>{s}</span>)}
          </div>
        </div>
      </section>
    );
  }

  function Contact() {
    const [copied, setCopied] = useState(false);

    async function copyEmail() {
      try {
        await navigator.clipboard.writeText(PROFILE.email);
        setCopied(true);
        setTimeout(() => setCopied(false), 2000);
      } catch (e) {
        /* clipboard blocked: the email link still works */
      }
    }

    return (
      <section className="section" id="contact">
        <div className="container contact-grid">
          <div>
            <h2>Let us talk</h2>
            <p className="section-intro" style={{ marginBottom: "1.5rem" }}>
              I’m always interested in learning, collaborating, and connecting with people who enjoy building useful things.
            </p>
            <a className="big-email" href={"mailto:" + PROFILE.email}>{PROFILE.email}</a>
            <div className="copy-row">
              <button className="btn" onClick={copyEmail}>{copied ? "Copied" : "Copy email"}</button>
            </div>
            <p className="live" aria-live="polite" style={{ marginTop: ".75rem" }}>
              {copied ? "Email copied to your clipboard." : ""}
            </p>
          </div>
          <ul className="social-list">
            {SOCIALS.map((s) => (
              <li key={s.label}>
                <a href={s.href} target="_blank" rel="noreferrer">{s.label}</a>
              </li>
            ))}
          </ul>
        </div>
      </section>
    );
  }

  function Footer() {
    return (
      <footer>
        <div className="container">
          <span>&copy; {new Date().getFullYear()} {PROFILE.name}</span>
          <a href="#top">Back to top</a>
        </div>
      </footer>
    );
  }

  function App() {
    const [theme, setTheme] = useTheme();
    return (
      <>
        <Header theme={theme} onToggle={() => setTheme(theme === "dark" ? "light" : "dark")} />
        <main>
          <Hero />
          <About />
          <Work />
          <Skills />
          <Contact />
        </main>
        <Footer />
      </>
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
